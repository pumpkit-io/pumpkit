[project]
name = "pumpkit-backend"
version = "0.1.0"
description = "Backend for Pumpkit, an open-source AI writing tool for X that writes Posts in the style of chosen X authors and publishes them on schedule."
license = "AGPL-3.0-only"
authors = [
    {name = "Francesco Paoli Leonardi", email = "fpaolileonardi@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic[email]>=2.10.5",
    "sqlalchemy>=2.0,<2.2",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.0",
    "python-jose>=3.3.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "asyncpg>=0.30.0",
    "sqlalchemy-utils>=0.41.2",
    "pydantic-settings>=2.7.1",
    "google-auth-oauthlib>=1.2.1",
    "google-api-python-client>=2.162.0",
    "cachetools>=5.5.2",
    "itsdangerous>=2.2.0",
    "python-ulid>=3.0.0",
    "python-jwt>=4.1.0",
    "pyjwt>=2.10.1",
    "jinja2>=3.1.6",
    "greenlet>=3.2.4",
    "stripe>=15.6,<16",
    "slowapi>=0.1.9",
    "openai>=2.0.0,<3.0.0",
    "httpx>=0.28.0",
    "posthog>=7.0.0",
    "mcp>=2.3.0,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12.12",
    "pyright>=1.1.405",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.23.0",
    "aiosqlite>=0.21.0",
    "import-linter>=2.15",
    "aiosmtpd>=1.4.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pumpkit"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",
]
fixable = ["ALL"]
unfixable = []

exclude = [
    ".git",
    ".venv",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint.isort]
known-first-party = ["pumpkit"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

# ADR 0008's import rules. pumpkit.main, pumpkit.models and pumpkit.mcp_server wire every area
# together, so they sit outside the layers.
[tool.importlinter]
root_packages = ["pumpkit"]

[[tool.importlinter.contracts]]
name = "Areas import only the areas below them"
type = "layers"
layers = [
    "pumpkit.scheduling",
    "pumpkit.posts",
    "pumpkit.authors | pumpkit.x_connection | pumpkit.support",
    "pumpkit.billing",
    "pumpkit.auth",
    "pumpkit.core",
]

[[tool.importlinter.contracts]]
name = "core imports no area"
type = "forbidden"
source_modules = ["pumpkit.core"]
forbidden_modules = [
    "pumpkit.auth",
    "pumpkit.billing",
    "pumpkit.authors",
    "pumpkit.x_connection",
    "pumpkit.support",
    "pumpkit.posts",
    "pumpkit.scheduling",
]

[[tool.importlinter.contracts]]
name = "Only auth, pumpkit.main and pumpkit.mcp_server import auth.router or auth.mediator"
type = "protected"
protected_modules = ["pumpkit.auth.router", "pumpkit.auth.mediator"]
# The MCP server authenticates API keys through auth's mediator, as a router would.
allowed_importers = ["pumpkit.auth", "pumpkit.main", "pumpkit.mcp_server"]

[[tool.importlinter.contracts]]
name = "Only billing and pumpkit.main import billing.router or billing.mediator"
type = "protected"
protected_modules = ["pumpkit.billing.router", "pumpkit.billing.mediator"]
allowed_importers = ["pumpkit.billing", "pumpkit.main"]

[[tool.importlinter.contracts]]
name = "Only authors and pumpkit.main import authors.router or authors.mediator"
type = "protected"
protected_modules = ["pumpkit.authors.router", "pumpkit.authors.mediator"]
allowed_importers = ["pumpkit.authors", "pumpkit.main"]

[[tool.importlinter.contracts]]
name = "Only x_connection and pumpkit.main import x_connection.router or x_connection.mediator"
type = "protected"
protected_modules = ["pumpkit.x_connection.router", "pumpkit.x_connection.mediator"]
allowed_importers = ["pumpkit.x_connection", "pumpkit.main"]

[[tool.importlinter.contracts]]
name = "Only support and pumpkit.main import support.router"
type = "protected"
protected_modules = ["pumpkit.support.router"]
allowed_importers = ["pumpkit.support", "pumpkit.main"]

[[tool.importlinter.contracts]]
name = "Only posts and pumpkit.main import posts.router or posts.mediator"
type = "protected"
protected_modules = ["pumpkit.posts.router", "pumpkit.posts.mediator"]
allowed_importers = ["pumpkit.posts", "pumpkit.main"]

[[tool.importlinter.contracts]]
name = "Only scheduling and pumpkit.main import scheduling.router or scheduling.mediator"
type = "protected"
protected_modules = ["pumpkit.scheduling.router", "pumpkit.scheduling.mediator"]
allowed_importers = ["pumpkit.scheduling", "pumpkit.main"]

[[tool.importlinter.contracts]]
name = "Only pumpkit.mcp_server imports a tools module"
type = "protected"
protected_modules = ["pumpkit.authors.tools", "pumpkit.posts.tools", "pumpkit.scheduling.tools"]
allowed_importers = ["pumpkit.mcp_server"]

[[tool.importlinter.contracts]]
name = "Only pumpkit.main imports pumpkit.mcp_server"
type = "protected"
protected_modules = ["pumpkit.mcp_server"]
allowed_importers = ["pumpkit.main"]

[[tool.importlinter.contracts]]
name = "Router, then mediator, then service inside each area"
type = "layers"
containers = [
    "pumpkit.auth",
    "pumpkit.billing",
    "pumpkit.authors",
    "pumpkit.x_connection",
    "pumpkit.support",
    "pumpkit.posts",
    "pumpkit.scheduling",
]
# An area's MCP tools sit beside its router, over the same mediator. Scheduling's publisher
# process sits beside the mediator: both hand a publish to publishing, which commits it over
# publish's flush-only steps.
layers = [
    "router | (tools)",
    "(mediator) | (publisher)",
    "(publishing)",
    "(publish)",
    "(service)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
