[project]
name = "pumpkit-backend"
version = "0.1.0"
description = ""
license = "AGPL-3.0-only"
authors = [
    {name = "Francesco Paoli Leonardi", email = "fpaolileonardi@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic[email]>=2.10.5",
    "sqlalchemy>=2.0,<2.2",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.0",
    "python-jose>=3.3.0",
    "passlib>=1.7.4",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "asyncpg>=0.30.0",
    "sqlalchemy-utils>=0.41.2",
    "pydantic-settings>=2.7.1",
    "google-auth-oauthlib>=1.2.1",
    "google-api-python-client>=2.162.0",
    "cachetools>=5.5.2",
    "itsdangerous>=2.2.0",
    "python-ulid>=3.0.0",
    "python-jwt>=4.1.0",
    "pyjwt>=2.10.1",
    "jinja2>=3.1.6",
    "resend>=2.14.0",
    "greenlet>=3.2.4",
    "argon2-cffi>=25.1.0",
    "stripe>=15,<16",
    "slowapi>=0.1.9",
    "openai>=2.0.0,<3.0.0",
    "httpx>=0.28.0",
    "posthog>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12.12",
    "pyright>=1.1.405",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.23.0",
    "aiosqlite>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",  # Ignore line length violations
]
fixable = ["ALL"]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".venv",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
include = ["app"]
typeCheckingMode = "standard"
pythonVersion = "3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
