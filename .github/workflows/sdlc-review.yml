# sdlc checks on every pull request, written by the sdlc setup-sdlc skill. Needs no secrets.
# comment-slop: the code-comments patterns a regex can catch, in the lines the PR adds.
# The LLM review is the admin-run sdlc-review-llm.yml; both are required checks in the main ruleset.
name: sdlc review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: sdlc-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  comment-slop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git clone --depth 1 https://github.com/pumpkit-io/sdlc "$RUNNER_TEMP/sdlc"
      - name: Check the comments this PR adds
        run: git diff -U0 "$BASE_SHA...$HEAD_SHA" | perl "$RUNNER_TEMP/sdlc/hooks/comment-slop.pl"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
