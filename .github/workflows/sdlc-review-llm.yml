# The review-changes skill on Claude Code, run by hand so it spends the CLAUDE_CODE_OAUTH_TOKEN subscription only when an admin asks.
# Run it on the PR's branch (`gh workflow run sdlc-review-llm.yml --ref <branch>`): the required `review` status lands on that commit.
name: sdlc review (LLM)

on:
  workflow_dispatch:

concurrency:
  group: sdlc-review-llm-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: write
      statuses: write
      id-token: write
    steps:
      - name: Only repository admins may run the LLM review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          perm="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_TRIGGERING_ACTOR/permission" --jq .permission)" || perm=no
          [ "$perm" = admin ] || { echo "$GITHUB_TRIGGERING_ACTOR has $perm access; only admins can run this review"; exit 1; }
      - name: Find the pull request for this branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(gh pr view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json number,baseRefOid,headRefOid,state)" \
            || { echo "No pull request for $GITHUB_REF_NAME; run this workflow on a PR's branch"; exit 1; }
          [ "$(jq -r .state <<<"$pr")" = OPEN ] || { echo "The pull request for $GITHUB_REF_NAME is not open"; exit 1; }
          # A branch pushed after the dispatch would put a verdict for one commit onto another.
          [ "$(jq -r .headRefOid <<<"$pr")" = "$GITHUB_SHA" ] || { echo "$GITHUB_REF_NAME moved past this run's commit; dispatch the workflow again"; exit 1; }
          echo "number=$(jq -r .number <<<"$pr")" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r .baseRefOid <<<"$pr")" >> "$GITHUB_OUTPUT"
      # A PR leaves out check runs from workflow_dispatch, so the required `review` check is this commit status.
      - name: Mark the review pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=review \
            -f description="LLM review running" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          plugin_marketplaces: https://github.com/pumpkit-io/sdlc.git
          plugins: sdlc@pumpkit-io
          prompt: |
            Load the review-changes skill and review pull request #${{ steps.pr.outputs.number }}. This is a CI job, so nobody can answer questions.

            - Fixed point: ${{ steps.pr.outputs.base }}. HEAD is the pull request's head commit.
            - Spec: the issues the pull request body or its commit messages reference. Read the body with `gh pr view ${{ steps.pr.outputs.number }}`. With no reference, skip the Spec axis.
            - This job has no sub-agents: run the three reviews one after another in this session, as the skill describes for an agent that can't spawn them.
            - AGENTS.md's Worktrees rule doesn't apply to this job: resolve no worktree, and write the report in this checkout.
            - Change no tracked file. Write the final report, in Markdown, to `.sdlc-review.md` at the repo root, under the heading `## sdlc review of ${{ github.sha }}`, ending with the skill's verdict line.
          claude_args: |
            --model sonnet
            --allowedTools "Read,Glob,Grep,Write,Skill,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(gh pr view:*),Bash(gh issue view:*)"
            --disallowedTools "Agent,Task"
      - uses: marocchino/sticky-pull-request-comment@v2
        if: hashFiles('.sdlc-review.md') != ''
        with:
          header: sdlc-review
          number: ${{ steps.pr.outputs.number }}
          path: .sdlc-review.md
      - name: Fail on a blocking verdict
        run: |
          [ -f .sdlc-review.md ] || { echo "The review wrote no report"; exit 1; }
          verdict="$(grep -E '^Verdict: ' .sdlc-review.md | tail -n 1)" || true
          echo "${verdict:-No verdict line in the report}"
          [ "$verdict" = "Verdict: pass" ]
      - name: Report the result as the review status
        if: always() && steps.pr.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) state=success description="Verdict: pass" ;;
            failure) state=failure description="Blocking verdict or failed review" ;;
            *) state=error description="Review $JOB_STATUS" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=review \
            -f description="$description" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
