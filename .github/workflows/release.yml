name: Release
# Pushing a tag vX.Y.Z publishes both images to GHCR, then a GitHub Release with that version's CHANGELOG section.
# Running it by hand on any branch builds every image without pushing or releasing, to try a Dockerfile change.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      # Image tags and PUMPKIT_VERSION drop the tag's v.
      - id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-prerelease"
            exit 1
          fi
          case $version in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Check PUMPKIT_VERSION in .env.example
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected=${VERSION%%-*}
          actual=$(sed -n 's/^PUMPKIT_VERSION=//p' .env.example)
          if [ "$actual" != "$expected" ]; then
            echo "::error::.env.example sets PUMPKIT_VERSION=$actual; set it to $expected before tagging"
            exit 1
          fi
      # Fails before any image is pushed when the CHANGELOG has no section for this version.
      - name: Check release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: sh scripts/release-notes.sh "$VERSION" || { [ "$PRERELEASE" = true ] && sh scripts/release-notes.sh Unreleased; }

  # One native runner per platform, so no platform builds under QEMU; each pushes its image by digest for the merge job.
  images:
    needs: check
    if: ${{ !cancelled() && (needs.check.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [pumpkit-backend, pumpkit-web]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: pumpkit-backend
            context: backend
            file: backend/Dockerfile
          - image: pumpkit-web
            context: .
            file: infra/web/Dockerfile
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pumpkit-io/${{ matrix.image }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ghcr.io/pumpkit-io/${{ matrix.image }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags X.Y.Z, plus latest unless the tag is a pre-release, on one manifest list holding both platforms.
  manifests:
    needs: images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [pumpkit-backend, pumpkit-web]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pumpkit-io/${{ matrix.image }}
          tags: type=semver,pattern={{version}}
      - working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/pumpkit-io/${{ matrix.image }}
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$DOCKER_METADATA_OUTPUT_VERSION"

  release:
    needs: [check, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # A pre-release without its own CHANGELOG section takes the Unreleased one.
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          set -- --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
          if [ "$PRERELEASE" = true ]; then
            set -- "$@" --prerelease
            sh scripts/release-notes.sh "$VERSION" > notes.md || sh scripts/release-notes.sh Unreleased > notes.md
          else
            sh scripts/release-notes.sh "$VERSION" > notes.md
          fi
          gh release create "$GITHUB_REF_NAME" "$@"
