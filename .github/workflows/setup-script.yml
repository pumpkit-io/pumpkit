name: Setup script
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  setup-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: backend
      # Ubuntu's sh is dash, so this also catches bashisms.
      - run: sh scripts/check-setup.sh
