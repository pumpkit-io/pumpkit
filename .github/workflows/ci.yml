name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --no-banner --redact
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
        working-directory: backend
      - run: make check-backend
      - run: make test-backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: make check-frontend
      - run: make test-frontend
  e2e-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: make check-e2e
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write .env
        run: |
          cp .env.example .env
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=e2e|' .env
          sed -i "s|^JWT_SECRET_KEY=.*|JWT_SECRET_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^FERNET_ENCRYPTION_KEY=.*|FERNET_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')|" .env
          # The suite opens the Billing dialog, which only an Instance selling Plans shows.
          cat >> .env <<'EOF'
          STRIPE_SECRET_KEY=sk_test_dummy
          STRIPE_PUBLISHABLE_KEY=pk_test_dummy
          STRIPE_WEBHOOK_SECRET=whsec_dummy
          BILLING_PLAN_KEYS='["pumpkit_pro_monthly"]'
          EOF
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: make e2e
      - if: failure()
        run: docker compose -f compose.dev.yml logs --tail 100
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/setup.sh --public-url http://localhost:8080 --llm-api-key dummy --twitterapi-io-api-key dummy </dev/null
      - run: make smoke
      - name: Check search indexing turned on
        run: |
          ALLOW_SEARCH_INDEXING=true docker compose up -d --wait web
          EXPECT_SEARCH_INDEXING=true sh scripts/check-stack.sh
      - if: failure()
        run: docker compose logs --tail 100
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check-release-notes.sh
      - run: sh scripts/check-release-scripts.sh
