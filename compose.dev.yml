# Development stack with bind mounts and hot reload: `docker compose -f compose.dev.yml up --build`.
# Every service reads the repo root's .env; the app is at http://localhost:5173.
# scripts/dev-stack runs one copy per worktree: it sets the DEV_* variables below and passes its own -p.
name: pumpkit-dev

services:

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - ${DEV_DB_BIND:-5432}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s

  # Google sign-in and Stripe Emulators, one per stack; only scripts/dev-stack starts them, with compose.emulators.yml.
  emulate:
    build:
      context: .
      dockerfile: emulate.Dockerfile
    profiles: [emulators]
    command:
      - start
      - --host
      - 0.0.0.0
      - --port
      - "4000"
      - --service
      - ${EMULATE_SERVICES:-google,pumpkit-stripe}
      - --base-url
      - ${EMULATE_BASE_URL:-http://localhost:4000}
    environment:
      DEV_PUBLIC_URL: ${DEV_PUBLIC_URL:-http://localhost:5173}
      STRIPE_WEBHOOK_URL: ${STRIPE_WEBHOOK_URL:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - ./emulate.config.ts:/emulate/emulate.config.ts:ro
      - ./emulators:/emulate/emulators:ro
    ports:
      - 127.0.0.1::4000
      - 127.0.0.1::4001

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: /app/start.sh
    env_file: .env
    # The dev stack always runs locally against its own Postgres, behind the Vite dev server.
    environment: &dev-backend-environment
      ENV: local
      PUBLIC_URL: ${DEV_PUBLIC_URL:-http://localhost:5173}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Safe-mode switches: read from .env unless scripts/dev-stack overrides them.
      PUBLISHER_ENABLED: ${PUBLISHER_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      POSTHOG_ENABLED: ${POSTHOG_ENABLED:-false}
    volumes:
      - ./backend:/app
      - /app/.venv
      - media_data:/var/lib/pumpkit/media
    ports:
      - ${DEV_API_BIND:-8000}:8000
    depends_on:
      db:
        condition: service_healthy

  # Publishes due Scheduled posts (ADR 0007). The backend runs the migrations.
  publisher:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m pumpkit.scheduling.publisher
    # On stop, a post X is being sent gets its answer (2 min at most); any other is handed back.
    stop_grace_period: 3m
    env_file: .env
    environment: *dev-backend-environment
    volumes:
      - ./backend:/app
      - /app/.venv
      - media_data:/var/lib/pumpkit/media
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_BYPASS_AUTH: ${VITE_BYPASS_AUTH:-false}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - ${DEV_WEB_BIND:-5173}:5173
    depends_on:
      - backend

volumes:
  postgres_data:
  # Media files the backend stores and the publisher uploads to X (ADR 0021).
  media_data:
