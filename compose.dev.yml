# Development stack with bind mounts and hot reload: `docker compose -f compose.dev.yml up --build`.
# Every service reads the repo root's .env; the app is at http://localhost:5173.
name: pumpkit-dev

services:

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: /app/start.sh
    env_file: .env
    # The dev stack always runs locally against its own Postgres, behind the Vite dev server.
    environment: &dev-backend-environment
      ENV: local
      PUBLIC_URL: http://localhost:5173
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - ./backend:/app
      - /app/.venv
    ports:
      - 8000:8000
    depends_on:
      db:
        condition: service_healthy

  # Publishes due Scheduled posts (ADR 0007). The backend runs the migrations.
  publisher:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m pumpkit.scheduling.publisher
    env_file: .env
    environment: *dev-backend-environment
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_BYPASS_AUTH: ${VITE_BYPASS_AUTH:-false}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - 5173:5173
    depends_on:
      - backend

volumes:
  postgres_data:
